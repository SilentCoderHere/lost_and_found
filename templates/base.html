<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}Lost & Found{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />

    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <header>
      <a href="{{ url_for('home.home') }}">Lost <span>&</span> Found</a>

      <nav>
        <a href="{{ url_for('home.home') }}">Home</a>
        <a href="{{ url_for('report.report') }}">Report</a>
        <a class="nav-button" href="{{ url_for('list_items.list_items') }}"
          >List Items</a
        >
      </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>© Lost & Found</footer>
  </body>
</html>
